# YOLOv5s-Lite — Optimized for FPGA Kria KV260
# 3 thay đổi: C3→C3_DWS, depth all=1, SiLU→LeakyReLU(0.1)

nc: 2  # 2 classes: Empty, Occupied
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  [[-1, 1, Conv, [64, 3, 2]],         # 0-P1/2  stem_a: stride 2
   [-1, 1, Conv, [64, 3, 1]],         # 1       stem_b: stride 1
   [-1, 1, Conv, [128, 3, 2]],        # 2-P2/4
   [-1, 1, C3_DWS, [128]],            # 3
   [-1, 1, Conv, [256, 3, 2]],        # 4-P3/8
   [-1, 1, C3_DWS, [256]],            # 5
   [-1, 1, Conv, [512, 3, 2]],        # 6-P4/16
   [-1, 1, C3_DWS, [512]],            # 7
   [-1, 1, Conv, [1024, 3, 2]],       # 8-P5/32
   [-1, 1, C3_DWS, [1024]],           # 9
   [-1, 1, SPPF, [1024, 5]],          # 10
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],                 # 11
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 12
   [[-1, 7], 1, Concat, [1]],                  # 13 cat backbone P4
   [-1, 1, C3_DWS, [512, False]],              # 14

   [-1, 1, Conv, [256, 1, 1]],                 # 15
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 16
   [[-1, 5], 1, Concat, [1]],                  # 17 cat backbone P3
   [-1, 1, C3_DWS, [256, False]],              # 18  (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],                 # 19
   [[-1, 15], 1, Concat, [1]],                 # 20 cat head P4
   [-1, 1, C3_DWS, [512, False]],              # 21  (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],                 # 22
   [[-1, 11], 1, Concat, [1]],                 # 23 cat head P5
   [-1, 1, C3_DWS, [1024, False]],             # 24  (P5/32-large)

   [[18, 21, 24], 1, Detect, [nc, anchors]],   # 25
  ]